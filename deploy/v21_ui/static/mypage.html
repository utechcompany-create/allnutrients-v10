<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이페이지 | 올영양소</title><link rel="stylesheet" href="assets/online.css"><link rel="stylesheet" href="assets/mypage-returns.css"><style>.benefit-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.point-big{font-size:32px;font-weight:900;color:var(--brand)}.order-actions{display:grid;gap:7px;min-width:210px}.order-actions .action-line{display:grid;grid-template-columns:1fr auto;gap:6px}.order-actions select{min-width:130px}@media(max-width:700px){.benefit-grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="wrap nav"><a class="logo" href="index.html">올영양소</a><div class="actions"><a class="btn ghost" href="index.html">쇼핑몰</a><button class="btn ghost" id="logoutBtn">로그아웃</button></div></div></header>
<main><div class="wrap"><h1 class="page-title">마이페이지</h1><p class="sub" id="hello"></p><div class="benefit-grid"><section class="card"><h2>보유 포인트</h2><div class="point-big" id="pointTotal">0P</div><div id="pointHistory" class="muted"></div></section><section class="card"><h2>사용 가능한 쿠폰</h2><div id="couponList"></div></section></div><section class="card"><h2>비밀번호 변경</h2><form id="pwForm" class="grid2"><label>현재 비밀번호<input type="password" name="currentPassword" required></label><label>새 비밀번호<input type="password" name="newPassword" minlength="8" required></label><label class="full">새 비밀번호 확인<input type="password" name="confirmPassword" minlength="8" required></label><div class="full"><button class="btn primary">비밀번호 변경</button></div></form></section><section class="card"><h2>주문 / 배송 현황</h2><p class="muted">주문취소·반품·교환 사유를 선택한 후 신청하세요. 반품은 단순 변심일 때 상품별 설정 차감액이 적용되고, 나머지 사유는 상품금액 전액이 환불됩니다. 부분 반품 수량이 정확히 1박스 분량이면 설정 차감액의 50%만 적용됩니다.</p><div class="table-wrap"><table><thead><tr><th>주문번호</th><th>주문일</th><th>상품</th><th>결제</th><th>주문상태</th><th>배송</th><th>금액</th><th>처리</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card return-section" id="returnSection" aria-labelledby="returnTitle"><div class="return-heading"><h2 id="returnTitle">반품 / 환불 내역</h2><button class="btn ghost small" id="refreshReturns" type="button">새로고침</button></div><p class="muted">반품이 완료된 후에도 상품, 차감액, 환불금액과 완료일을 확인할 수 있습니다.</p><p id="returnSummary" class="muted" role="status">반품 내역을 불러오는 중입니다.</p><div class="tabs" id="returnFilters" role="group" aria-label="반품 내역 필터"><button class="tab active" type="button" data-return-filter="all" aria-pressed="true">전체</button><button class="tab" type="button" data-return-filter="active" aria-pressed="false">진행 중</button><button class="tab" type="button" data-return-filter="completed" aria-pressed="false">반품 완료</button></div><p class="notice" id="returnError" role="alert" hidden></p><div id="returnHistory" aria-busy="true"></div></section></div></main><div class="toast" id="toast"></div><script src="assets/api.js"></script><script src="assets/mypage-returns.js"></script><script>
const trackLinks={CJ:'https://trace.cjlogistics.com/next/tracking.html?wblNo=',한진:'https://www.hanjin.com/kor/CMS/DeliveryMgr/WaybillSch.do?mCode=MN038&schLang=KR&wblnumText2=',롯데:'https://www.lotteglogis.com/home/reservation/tracking/linkView?InvNo=',우체국:'https://service.epost.go.kr/trace.RetrieveDomRigiTraceList.comm?sid1='};const t=document.getElementById('toast');let cancelReasons=[],returnReasons=[],exchangeReasons=[];function toast(s){t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
const opts=(xs,placeholder='사유 선택')=>`<option value="">${placeholder}</option>`+xs.map(x=>`<option value="${AppAPI.esc(x.code)}">${AppAPI.esc(x.name)}</option>`).join('');
function eligible(o){const shippedByOrder=['SHIPPED','DELIVERED','PARTIAL_RETURN','RETURNED','EXCHANGE_IN_PROGRESS','EXCHANGED'].includes(o.orderStatus),shippedByShipment=!!(o.shipment&&((o.shipment.trackingNumber||'').trim()||['SHIPPED','DELIVERED','RETURNED'].includes(o.shipment.status)));return (shippedByOrder||shippedByShipment)&&['PAID','PARTIAL_REFUNDED'].includes(o.paymentStatus)}
function actionHtml(o){let html='<div class="order-actions">';if(o.canCancel)html+=`<div class="action-line"><select id="cancel-${o.orderNo}">${opts(cancelReasons,'취소 사유')}</select><button class="btn ghost small" onclick="cancelOrder('${o.orderNo}')">주문취소</button></div>`;else if(o.cancelRequest?.status==='REQUESTED')html+='<span class="badge">취소신청중</span>';if(eligible(o)){html+=`<div class="action-line"><select id="return-${o.orderNo}">${opts(returnReasons,'반품 사유')}</select><button class="btn ghost small" onclick="openRequest('${o.orderNo}','RETURN')">반품 신청</button></div><div class="action-line"><select id="exchange-${o.orderNo}">${opts(exchangeReasons,'교환 사유')}</select><button class="btn ghost small" onclick="openRequest('${o.orderNo}','EXCHANGE')">교환 신청</button></div><div class="muted">반품 사유를 선택하면 상세 반품 신청 화면으로 이동합니다.</div>`}else{html+=`<div class="action-line"><select disabled><option>반품 사유</option></select><button class="btn ghost small" disabled>반품 신청</button></div><div class="action-line"><select disabled><option>교환 사유</option></select><button class="btn ghost small" disabled>교환 신청</button></div><div class="muted">반품·교환은 결제완료 후 송장번호가 등록되거나 배송이 시작되면 신청할 수 있습니다.</div>`}html+=`<a class="btn ghost small" href="return-request.html?orderNo=${encodeURIComponent(o.orderNo)}#historyBox">반품·교환 내역 확인</a>`;return html+'</div>'}
async function load(){const me=await AppAPI.api('/api/auth/me');if(!me.authenticated){location.href='login.html?next=mypage.html';return}MyPageReturns.load();hello.textContent=me.name+'님, 주문과 혜택을 확인할 수 있습니다.';const [os,pts,cps,cr,rr,er]=await Promise.all([AppAPI.api('/api/orders/my'),AppAPI.api('/api/points/me'),AppAPI.api('/api/coupons/my'),AppAPI.api('/api/order-cancel-reasons'),AppAPI.api('/api/return-reasons?requestType=RETURN'),AppAPI.api('/api/return-reasons?requestType=EXCHANGE')]);cancelReasons=cr;returnReasons=rr;exchangeReasons=er;pointTotal.textContent=Number(pts.balance).toLocaleString()+'P';pointHistory.innerHTML=(pts.history||[]).slice(0,5).map(x=>`<div>${new Date(x.createdAt).toLocaleDateString()} · ${AppAPI.esc(x.reason)} · ${x.amount>0?'+':''}${Number(x.amount).toLocaleString()}P</div>`).join('')||'포인트 내역이 없습니다.';couponList.innerHTML=cps.length?cps.map(c=>`<div class="order-card"><b>${AppAPI.esc(c.name)}</b><div class="muted">${c.discountType==='PERCENT'?c.value+'%':AppAPI.money(c.value)} 할인 · ${c.expiresAt?new Date(c.expiresAt).toLocaleDateString()+'까지':'기간 제한 없음'}</div></div>`).join(''):'<div class="muted">사용 가능한 쿠폰이 없습니다.</div>';rows.innerHTML=os.length?os.map(o=>{let ship='배송 준비중';if(o.shipment){ship=AppAPI.esc(o.shipment.status);if(o.shipment.trackingNumber){const base=trackLinks[o.shipment.carrier]||'';ship+=`<div><b>${AppAPI.esc(o.shipment.carrier)} ${AppAPI.esc(o.shipment.trackingNumber)}</b>${base?` · <a target="_blank" href="${base+encodeURIComponent(o.shipment.trackingNumber)}">배송조회</a>`:''}</div>`}}return `<tr><td><b>${AppAPI.esc(o.orderNo)}</b></td><td>${new Date(o.createdAt).toLocaleDateString()}</td><td>${o.items.map(i=>AppAPI.esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${AppAPI.esc(o.paymentStatus)}</td><td>${AppAPI.esc(o.orderStatus)}</td><td>${ship}</td><td class="money">${AppAPI.money(o.totalAmount)}</td><td>${actionHtml(o)}</td></tr>`}).join(''):'<tr><td colspan="8">주문내역이 없습니다.</td></tr>'}
window.cancelOrder=async no=>{const el=document.getElementById('cancel-'+no),reason=el?.value||'';if(!reason)return toast('주문취소 사유를 선택해 주세요.');try{await AppAPI.api('/api/orders/'+encodeURIComponent(no)+'/cancel-request',{method:'POST',body:{reason}});toast('주문취소 신청이 접수되었습니다.');await load()}catch(e){toast(e.message)}};
window.openRequest=(no,type)=>{const id=(type==='RETURN'?'return-':'exchange-')+no,reason=document.getElementById(id)?.value||'';if(!reason)return toast((type==='RETURN'?'반품':'교환')+' 사유를 선택해 주세요.');location.href=`return-request.html?orderNo=${encodeURIComponent(no)}&type=${type}&reason=${encodeURIComponent(reason)}`};
pwForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('newPassword')!==f.get('confirmPassword'))return toast('새 비밀번호가 일치하지 않습니다.');try{await AppAPI.api('/api/auth/change-password',{method:'POST',body:{currentPassword:f.get('currentPassword'),newPassword:f.get('newPassword')}});e.target.reset();toast('비밀번호를 변경했습니다.')}catch(err){toast(err.message)}};logoutBtn.onclick=async()=>{try{await AppAPI.api('/api/auth/logout',{method:'POST'});location.href='index.html'}catch(e){toast(e.message)}};load().catch(e=>toast(e.message));
</script></body></html>
