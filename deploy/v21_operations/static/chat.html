<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실시간 대화방 | 올영양소</title><link rel="stylesheet" href="assets/online.css"><link rel="stylesheet" href="assets/operations.css"></head><body>
<header><div class="wrap nav"><a class="logo" href="index.html">올영양소</a><div class="actions"><a class="btn ghost" href="index.html">쇼핑몰</a><a class="btn ghost" href="mypage.html">마이페이지</a></div></div></header>
<main><div class="wrap"><h1 class="page-title">실시간 대화방</h1><p class="sub">회원들과 함께 이야기하거나 관리자에게 1:1로 문의하세요.</p><div class="chat-tabs" aria-label="대화방 선택"><button class="btn ghost active" data-kind="GROUP" aria-pressed="true">전체 대화방</button><button class="btn ghost" data-kind="DIRECT" aria-pressed="false">1:1 대화방</button></div><div id="customerChat"></div><p><a href="board.html">고객게시판으로 이동</a></p></div></main>
<script src="assets/api.js"></script><script src="assets/chat.js"></script><script>
(async()=>{const me=await AppAPI.api('/api/auth/me');if(!me.authenticated){location.href='login.html?next=chat.html';return}const chat=ChatUI.mount(document.getElementById('customerChat'),{admin:me.role==='admin'});document.querySelector('.chat-tabs').onclick=e=>{const b=e.target.closest('[data-kind]');if(!b)return;document.querySelectorAll('[data-kind]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});chat.open(b.dataset.kind)};chat.open('GROUP')})().catch(()=>{document.getElementById('customerChat').textContent='대화방을 불러오지 못했습니다. 페이지를 새로고침해 주세요.'});
</script></body></html>
