<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모바일 화면 미리보기 | 올영양소</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eaf0e9;color:#183226;font-family:system-ui,sans-serif}header{padding:16px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;background:#fff;border-bottom:1px solid #d6e0d6;flex-wrap:wrap}h1{font-size:18px;margin:0}p{font-size:12px;color:#627167;margin:6px 0 0}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,a{font:inherit;font-size:13px;padding:10px;border:1px solid #d6e0d6;border-radius:9px;background:#fff;color:inherit;text-decoration:none}main{padding:24px 12px;display:flex;justify-content:center;overflow:auto}iframe{display:block;width:390px;height:844px;flex-shrink:0;border:1px solid #d6e0d6;border-radius:22px;background:white;box-shadow:0 20px 60px #18322617}@media(max-width:500px){header{padding:14px 16px}main{justify-content:flex-start}iframe{border-radius:12px}}
</style></head><body><header><div><h1>모바일 화면 미리보기</h1><p>같은 쇼핑몰을 휴대폰 너비로 확인합니다. 실제 쇼핑몰과 연결된 화면입니다.</p></div><div class="tools"><label>화면 너비 <select id="width"><option value="320">320px · 작은 화면</option><option value="390" selected>390px · 기본</option><option value="430">430px · 큰 화면</option><option value="768">768px · 태블릿</option></select></label><a href="index.html">쇼핑몰 열기</a></div></header><main><iframe id="mobileFrame" title="모바일 쇼핑몰" src="index.html"></iframe></main><script>document.getElementById('width').onchange=e=>{document.getElementById('mobileFrame').style.width=e.target.value+'px'};</script></body></html>
