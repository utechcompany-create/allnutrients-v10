<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>올영양소 | 과일·채소 주스 전문몰</title>
<style>
:root{--bg:#f6f8f4;--card:#fff;--ink:#183226;--muted:#6d7c72;--brand:#2f7d4e;--line:#e2e9e3;--danger:#d84e4e;--r:20px}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
.container{width:min(1180px,calc(100% - 36px));margin:auto}.top{background:#173126;color:#fff;text-align:center;padding:8px;font-size:13px}
header{position:sticky;top:0;z-index:30;background:rgba(246,248,244,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-weight:900;font-size:25px;letter-spacing:-1.2px;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:50% 48% 50% 44%;background:linear-gradient(145deg,#95d36e,#2f7d4e)}nav{display:flex;gap:24px;font-weight:800;font-size:14px}
.actions{display:flex;gap:8px}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}.btn.primary{background:var(--brand);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.small{padding:9px 12px;font-size:13px}
.hero{padding:54px 0 30px}.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.hero-copy{padding:40px 0}.eyebrow{font-weight:900;color:var(--brand);font-size:13px;letter-spacing:.08em}
h1{font-size:clamp(44px,5vw,72px);line-height:1.03;letter-spacing:-3px;margin:12px 0 20px}.hero p{font-size:18px;color:var(--muted);max-width:560px}
.hero-art{min-height:430px;border-radius:30px;background:linear-gradient(145deg,var(--hero-start,#dcefbf),var(--hero-end,#f4f8df));position:relative;overflow:hidden;box-shadow:0 20px 55px rgba(30,60,42,.12)}
.hero-bottle{position:absolute;width:170px;height:320px;border-radius:50px 50px 34px 34px;background:rgba(255,255,255,.9);left:50%;bottom:44px;transform:translateX(-50%) rotate(-4deg);box-shadow:0 25px 50px rgba(30,70,42,.18)}.hero-bottle:before{content:"";position:absolute;width:66px;height:36px;left:50%;top:-27px;transform:translateX(-50%);background:#286c43;border-radius:8px}.hero-label{position:absolute;left:16px;right:16px;top:98px;background:white;border-radius:18px;text-align:center;padding:24px 10px;font-weight:900}.hero-label small{display:block;color:#79877e;font-size:10px;letter-spacing:.15em}
.orb{position:absolute;border-radius:50%}.o1{width:150px;height:150px;background:#ffb86b;left:-30px;bottom:30px}.o2{width:100px;height:100px;background:#f6df76;right:25px;top:32px}.o3{width:80px;height:80px;background:#ff9aa4;left:55px;top:50px}
.section{padding:64px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}h2{font-size:34px;letter-spacing:-1.4px;margin:0}.head p{margin:6px 0 0;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}.chip.active{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(var(--product-cols,4),1fr);gap:18px}.product{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius,22px);overflow:hidden;display:flex;flex-direction:column;transition:.2s}.product:hover{transform:translateY(-4px);box-shadow:0 18px 42px rgba(30,60,42,.1)}
.visual{aspect-ratio:1/1;background:linear-gradient(145deg,#e4f2d1,#fafcf5);display:grid;place-items:center;position:relative;overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.emoji{font-size:84px;filter:drop-shadow(0 15px 14px rgba(0,0,0,.1))}
.badge{position:absolute;left:12px;top:12px;background:#183226;color:#fff;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.sold{position:absolute;inset:0;background:rgba(24,50,38,.58);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}
.pbody{padding:17px;display:flex;flex-direction:column;gap:8px;flex:1}.pbody h3{margin:0;font-size:18px}.meta{font-size:12px;color:#87948c}.desc{font-size:13px;color:var(--muted);min-height:39px}.price-row{display:flex;justify-content:space-between;align-items:end;margin-top:auto}.price del{display:block;font-size:12px;color:#9ba6a0}.price strong{font-size:20px}
.cart-pill{position:relative}.count{position:absolute;right:-4px;top:-6px;background:#e45454;color:#fff;border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;font-size:10px}
.drawer{position:fixed;inset:0;z-index:80;pointer-events:none}.drawer.open{pointer-events:auto}.back{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:.2s}.drawer.open .back{opacity:1}.panel{position:absolute;right:0;top:0;bottom:0;width:min(450px,94vw);background:white;padding:22px;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}.drawer.open .panel{transform:translateX(0)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.cart-list{display:grid;gap:10px;margin:20px 0;overflow:auto}.cart-item{border:1px solid var(--line);border-radius:15px;padding:12px}.qty{display:flex;gap:6px;align-items:center;margin-top:6px}.qty button{width:27px;height:27px;border:1px solid var(--line);background:#fff;border-radius:8px}.total{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;font-size:20px;font-weight:900}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.4);display:none;place-items:center;padding:20px}.modal.open{display:grid}.modal-card{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:800;display:grid;gap:6px}input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}
.notice{background:#fff8dc;border:1px solid #f0df9b;color:#6e5b1c;border-radius:14px;padding:12px 14px;font-size:13px;margin:12px 0}
footer{background:#13281d;color:#cbd6cf;margin-top:60px;padding:42px 0}footer p{color:#aebbb3;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;background:#173126;color:#fff;padding:11px 15px;border-radius:12px;font-weight:800;font-size:13px;transition:.2s;z-index:120}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){nav{display:none}.hero-grid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero-art{min-height:360px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
header .nav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);min-height:70px;height:auto;column-gap:20px}
header .nav>.logo{justify-self:start;white-space:nowrap}header .nav>.actions{justify-self:end}
header .main-nav{display:flex;justify-content:center;align-items:center;gap:24px;white-space:nowrap}
header .main-nav a{display:inline-flex;align-items:center;min-height:44px;padding:8px 0}
header .main-nav a:hover{color:var(--brand)}header .main-nav a:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:4px}
#products,#story{scroll-margin-top:90px}
@media(max-width:900px){header .nav{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:0 12px;padding-top:12px}header .nav>.logo{grid-column:1;grid-row:1}header .nav>.actions{grid-column:2;grid-row:1}header .main-nav{display:flex;grid-column:1/-1;grid-row:2;justify-self:center;padding:4px 0 6px;gap:clamp(12px,4vw,24px)}#products,#story{scroll-margin-top:135px}}
@media(max-width:560px){header .main-nav{font-size:13px}}
</style>
<link rel="stylesheet" href="assets/storefront.css">
</head>
<body>
<div class="top" id="topNotice">올영양소 공식몰 · 5만원 이상 무료배송</div>
<header><div class="container nav">
<a class="logo" href="#"><span class="mark" id="logoMark"></span><span id="brandName">올영양소</span></a>
<nav class="main-nav" id="mainNavigation" aria-label="메인 메뉴"><a href="#products">전체상품</a><a href="#best">베스트</a><a href="#story">브랜드</a><a href="board.html">고객게시판</a></nav>
<div class="actions"><a class="btn ghost small" href="guest-order.html">비회원 주문조회</a><a class="btn ghost small" id="accountLink" href="login.html">로그인</a><a class="btn ghost small" href="admin.html">관리자</a><button class="btn ghost small cart-pill" id="cartBtn">🛒<span class="count" id="cartCount">0</span></button></div>
</div></header>
<main id="pageSections" aria-label="쇼핑몰 콘텐츠"></main>
<footer><div class="container"><div class="logo" style="color:#fff"><span class="mark"></span><span id="footerBrandName">올영양소</span></div><p>올영양소 온라인몰 · 회원 주문, 결제, 배송상태를 서버에서 관리합니다.</p></div></footer>
<div class="drawer" id="drawer"><div class="back" onclick="closeCart()"></div><div class="panel">
<div class="row"><h3 style="margin:0">장바구니</h3><button class="btn ghost small" onclick="closeCart()">닫기</button></div>
<div class="cart-list" id="cartList"></div><div class="total"><div class="row"><span>총 상품금액</span><span id="totalPrice">0원</span></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="openOrder()">주문서 작성</button></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/api/bootstrap.js"></script>
<script src="assets/api.js"></script>
<script src="assets/shop-core.js"></script>
<script src="assets/storefront-online.js"></script>
<script src="assets/account-nav.js"></script>
</body></html>
