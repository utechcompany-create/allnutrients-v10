name: V11 Public Feature Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check V11 public APIs and screens
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://allnutrients-v11.onrender.com"
          test "$(curl -fsSL "$BASE/api/health" | python -c 'import json,sys; d=json.load(sys.stdin); print(d["version"])')" = "11.0"
          curl -fsSL "$BASE/api/config" | python -c 'import json,sys; d=json.load(sys.stdin); assert "commerce" in d; assert "shippingFee" in d["commerce"]; assert "freeShippingThreshold" in d["commerce"]'
          curl -fsSL "$BASE/api/categories" | python -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d,list) and len(d)>=1'
          curl -fsSL "$BASE/admin.html" | grep -q "admin-v11.js"
          curl -fsSL "$BASE/detail.html?id=P1001" | grep -q "즉시 구매"
          curl -fsSL "$BASE/detail.html?id=P1001" | grep -q "장바구니로 이동"
          curl -fsSL "$BASE/checkout.html" | grep -q "우편번호 검색"
          curl -fsSL "$BASE/checkout.html" | grep -q "postcode.v2.js"
          curl -fsSL "$BASE/mypage.html" | grep -q "포인트"
          curl -fsSL "$BASE/mypage.html" | grep -q "쿠폰"
          echo "V11 public UI/API checks passed"
      - name: Check new-member coupon and password change
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://allnutrients-v11.onrender.com"
          TS="$(date +%s)"
          EMAIL="v11-smoke-$TS@example.invalid"
          PASS="V11-Smoke-$TS-Aa1!"
          JAR=/tmp/cookies.txt
          curl -fsSL -c "$JAR" -b "$JAR" -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"name\":\"V11 테스트\"}" \
            "$BASE/api/auth/register" >/tmp/reg.json
          curl -fsSL -c "$JAR" -b "$JAR" "$BASE/api/coupons/my" >/tmp/coupons.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/coupons.json'))
          assert any(c.get('discountType')=='PERCENT' and int(c.get('value',0))==10 for c in d), d
          PY
          curl -fsSL -c "$JAR" -b "$JAR" "$BASE/api/points/me" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["balance"]==0'
          CSRF="$(grep 'allnutrients_csrf' "$JAR" | tail -1 | cut -f7)"
          NEWPASS="$PASS-X"
          curl -fsSL -c "$JAR" -b "$JAR" -H 'content-type: application/json' -H "x-csrf-token: $CSRF" \
            -d "{\"currentPassword\":\"$PASS\",\"newPassword\":\"$NEWPASS\"}" \
            "$BASE/api/auth/change-password" >/tmp/pw.json
          python -c 'import json; d=json.load(open("/tmp/pw.json")); assert d.get("ok") is True'
          echo "V11 member benefit/password checks passed"